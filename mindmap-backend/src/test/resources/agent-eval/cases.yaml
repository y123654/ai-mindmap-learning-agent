# =============================================================================
# P0-A2 基线用例集（50 条）
#
# 用途：在 P0-1（提示词检索策略）与 P0-3（证据协议）之前跑出**第一份真实基线**，
#       之后每次 prompt/模型/检索参数变更都用同一套用例重跑对比。
#       本文件里的数字必须来自 -Peval 真调，不能手工填。
#
# schema 依据：docs/学习Agent求职强化方案-评测自主性与行动能力-v1.0.md §4 P0-4
#   expect.tools_any 的语义是「至少调用其中一个」（原文注释），不是「必须全部调用」。
#   expect.refusal_keywords / expect.forbidden_contains 是 P0-A1 的增量字段（原 schema 没有），
#   用于「拒答识别」与「注入泄漏检测」，不改变原字段语义。
#   key_points 只进辅助覆盖率，不参与 PASS/FAIL；拒答与注入才参与判定。
#   注入用例的 poison 笔记由 AgentEvalSeeder 固定提供（文档 id 888904），不依赖真实账号数据。
#
# 50 条分布（每类数量固定，逐条第一项 tag 就是分类标签）：
#   单跳 15 / 多跳 8 / 导图 6 / 题目 5 / 记忆 5 / 无依据拒答 6 / 闲聊 3 / 注入 2
#
# 覆盖：Seeder 的 4 篇笔记（调度 888901、同步 888902、内存 888903、实验记录 888904）、
#       1 张导图（888911）、3 道题（888921~888923）、3 条记忆（888931~888933）。
#
# 本文件只新增、不改动已有测试；用例条数只增不减（见方案 §8.3）。
# =============================================================================
